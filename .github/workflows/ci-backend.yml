name: CI Backend & Agent Engine

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'agent_engine/**'
      - '.github/workflows/ci-backend.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'agent_engine/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Start Database Services
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres redis
          until docker compose -f docker/docker-compose.yml exec -T postgres pg_isready -U careerforge -d careerforge_db; do
            echo "Waiting for postgres to be healthy..."
            sleep 2
          done

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend agent_engine

      - name: Run Mypy Typecheck
        run: |
          mypy backend/app --ignore-missing-imports || true

      - name: Run Unit Tests
        env:
          PYTHONPATH: ".:backend"
        run: |
          pytest -v backend/tests/
